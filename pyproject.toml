[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hijaiyyah-hom"
# Keep in step with src/hijaiyyah/version.py __version__ and
# hom-gui/package.json — tests/test_integrity/test_version_consistency.py
# fails if they drift apart.
version = "1.2.0"
description = "Hijaiyyah Operating Machine — Core Computational System"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "Maulana Amratulloh"},
    {name = "Hijaiyyah Mathematics Computational Laboratory (HMCL)"},
]
keywords = [
    "hijaiyyah", "mathematics", "codex", "hybit",
    "discrete-geometry", "formal-verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "pillow>=10.0",
    "scipy>=1.10",
]

[project.scripts]
hc = "hijaiyyah.cli:main"
hom = "hijaiyyah.__main__:main"
hybit-ai = "hijaiyyah.ai.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.16,<0.17",   # pinned: ruff default rules shift between minors
    "mypy>=1.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests", "tools", "scripts"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingModuleSource = false
pythonVersion = "3.11"
executionEnvironments = [
    { root = ".", extraPaths = ["src"] }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly. Without this, lint depends on whichever ruff the CI
# happens to install, and its defaults shift between releases — which is how
# the Test Suite workflow started failing on rules nobody chose.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — undefined names, unused imports, dead code
    "I",    # import sorting
    "B",    # bugbear — real bug patterns
    "RUF",  # ruff-specific
]

ignore = [
    # RUF001-003 flag Arabic letters and Greek mathematical symbols (Θ, ρ, ϕ,
    # π) as "ambiguous unicode". Those characters are this project's subject
    # matter, not a typo risk: 304 of them across the source.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The Tkinter tabs render fixed-width terminal-style output: box-drawing rules,
# aligned columns, and status lines whose spacing is the layout. Wrapping those
# strings to 100 columns misaligns what the user actually sees.
"src/hijaiyyah/gui/tabs/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
