name: Deploy HOM GUI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # Without this the build runs on whatever Node the runner ships with.
      # Vite 8 needs a modern one, and that mismatch is what broke this
      # workflow in April.
      - name: Set up Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hom-gui/package-lock.json

      - name: Install and Build 🔧
        working-directory: hom-gui
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: hom-gui/dist
          branch: gh-pages
